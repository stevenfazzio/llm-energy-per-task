# The models to measure: instruction-tuned, open-weight, up to about 15B parameters.
#
# Only `id` is required. Release date, parameter count, gating, chat template and
# the pinned commit are fetched from Hugging Face into models.lock.json by
#   uv run python -m llm_energy_per_task.models
#
# Optional keys:
#   pilot = true               part of the pilot
#   released = 2025-03-12      when the repo's creation date is not the launch date
#   params = 6_740_000_000     when the repo publishes no parameter count
#   trust_remote_code = true   when the engine cannot load the model without it
#   excluded = "why"           left out of the dataset, and not measured again

